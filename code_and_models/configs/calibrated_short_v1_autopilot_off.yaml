project: HetGAT-HRL
source: ablation_autopilot_toggle
recommended_variant: reward_boost_dockfix

env:
  phase: S
  scenario: B
  seed: 0
  num_nodes: 100
  num_edges: 200
  num_trucks: 3
  num_uavs: 4
  num_normal_tasks: 5
  num_emergency_tasks: 3
  max_steps: 170
  dt_seconds: 20.0
  hrl_interval: 10
  risk_spike_threshold: 0.30

physics:
  truck_speed_mps: 10.0
  uav_max_speed_mps: 17.0
  uav_battery_init: 0.70
  uav_bind_radius_m: 170.0
  uav_idle_discharge_per_step: 0.020
  uav_flight_discharge_per_step: 0.0
  uav_flight_discharge_per_m: 0.0001
  uav_charge_rate_per_step: 0.085
  uav_delivery_radius_m: 80.0
  uav_crash_penalty: -5.0
  uav_auto_approach_enabled: false
  uav_monitor_snap_enabled: false

reward:
  reward_step_penalty: -0.02
  reward_invalid_action: -0.10
  reward_idle_with_task: -0.06
  reward_pickup: 1.0
  reward_delivery_normal: 15.0
  reward_delivery_emergency: 20.0
  reward_docking_low_battery: 1.0
  docking_reward_battery_threshold: 0.5
  penalty_timeout_normal: -0.5
  penalty_timeout_emergency: -1.3
  use_pbrs: true
  pbrs_scale: 5.0

disturbance:
  stochastic_weather: true
  comm_block_prob: 0.0
  enable_comm_blackout: false
  logistic_beta0: -3.4
  logistic_beta_slope: 1.4
  logistic_beta_rain: 1.2
  logistic_beta_quake: 1.8
  logistic_beta_sr: 3.0
  logistic_beta_re: 1.1
  logistic_beta_vbase: 1.0
  lambda_aggressive: 0.045
  lambda_residual: 0.001
  percolation_lock_threshold: 0.35
  lambda_warmup_steps: 30
  lambda_warmup_min_factor: 0.35
