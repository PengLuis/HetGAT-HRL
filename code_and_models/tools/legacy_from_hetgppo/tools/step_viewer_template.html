<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HRL Step Viewer Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e1e; color: #d4d4d4; margin: 0; padding: 20px; }
        .container { display: flex; flex-direction: column; align-items: center; }
        .header { margin-bottom: 20px; text-align: center; }
        h1 { color: #569cd6; margin: 0 0 10px 0; }
        #canvas-container { position: relative; border: 1px solid #333; background-color: #000; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
        canvas { display: block; }
        .controls { margin-top: 20px; display: flex; gap: 15px; background: #252526; padding: 15px; border-radius: 8px; }
        button { background-color: #0e639c; color: white; border: none; padding: 8px 16px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button:hover { background-color: #1177bb; }
        .status-panel { margin-top: 15px; width: 100%; max-width: 800px; background: #252526; padding: 15px; border-radius: 8px; font-family: monospace; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Phase 1: Agent Step Viewer</h1>
            <div id="step-counter">Step: 0 / Max</div>
        </div>
        <div id="canvas-container">
            <canvas id="render-canvas"></canvas>
        </div>
        <div class="controls">
            <button id="btn-prev">&laquo; Prev Step</button>
            <button id="btn-play">Play / Pause</button>
            <button id="btn-next">Next Step &raquo;</button>
        </div>
        <div class="status-panel" id="status-panel">Awaiting Telemetry Data...</div>
    </div>
    
    <script id="telemetry-data" type="application/json">
        {}
    </script>

    <script>
        const canvas = document.getElementById('render-canvas');
        const ctx = canvas.getContext('2d');
        let currentStep = 0;
        let isPlaying = false;
        let playInterval = null;
        let telemetry = {};

        function loadTelemetry() {
            try {
                const dataElement = document.getElementById('telemetry-data');
                telemetry = JSON.parse(dataElement.textContent || '{}');
                renderStep();
            } catch (e) {
                document.getElementById('status-panel').textContent = "Error parsing telemetry data.";
            }
        }

        function renderStep() {
            // Placeholder JS renderer for the injected frames
            // Real implementation hooks into base64 images generated by Python
            if (!telemetry.frames || telemetry.frames.length === 0) return;
            document.getElementById('step-counter').textContent = `Step: ${currentStep} / ${telemetry.frames.length - 1}`;
            
            const frame = telemetry.frames[currentStep];
            if (frame && frame.image_base64) {
                const img = new Image();
                img.onload = () => {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                };
                img.src = "data:image/png;base64," + frame.image_base64;
            }
            
            document.getElementById('status-panel').textContent = 
                frame.metadata ? JSON.stringify(frame.metadata, null, 2) : "No metadata available.";
        }

        document.getElementById('btn-next').addEventListener('click', () => {
            if (telemetry.frames && currentStep < telemetry.frames.length - 1) { currentStep++; renderStep(); }
        });
        document.getElementById('btn-prev').addEventListener('click', () => {
            if (currentStep > 0) { currentStep--; renderStep(); }
        });
        document.getElementById('btn-play').addEventListener('click', () => {
            isPlaying = !isPlaying;
            if (isPlaying) {
                playInterval = setInterval(() => {
                    if (telemetry.frames && currentStep < telemetry.frames.length - 1) { currentStep++; renderStep(); }
                    else { clearInterval(playInterval); isPlaying = false; }
                }, 200);
            } else { clearInterval(playInterval); }
        });

        window.onload = loadTelemetry;
    </script>
</body>
</html>
